name: Enflasyon Otomatik Güncelle

on:
  schedule:
    - cron: '0 8 4 * *'
  workflow_dispatch:

jobs:
  enflasyon-guncelle:
    runs-on: ubuntu-latest
    
    steps:
      - name: TÜİK TÜFE Verisini Çek ve Gist Güncelle
        env:
          GIST_ID: 793a9aa97f1c6fada2882976bd4834aa
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          echo "TÜİK sitesinden TÜFE verisi çekiliyor..."
          
          HTML=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://data.tuik.gov.tr/" 2>/dev/null)
          
          YILLIK=$(echo "$HTML" | grep -oP '\d{1,3},\d{2}(?= \(Yıl\))' | head -1)
          
          if [ -z "$YILLIK" ]; then
            echo "Ana sayfa parse başarısız, kategori API deneniyor..."
            BULTEN=$(curl -s -A "Mozilla/5.0" \
              "https://data.tuik.gov.tr/api/categoriesnews?lang=1&categoryId=106" 2>/dev/null)
            BULTEN_ID=$(echo "$BULTEN" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for item in data:
            title = item.get('newsTitle','').lower()
            if 'tüketici fiyat' in title or 'tuketici fiyat' in title:
              print(item.get('newsId',''))
              break
          " 2>/dev/null)
            if [ -n "$BULTEN_ID" ]; then
              BULTEN_HTML=$(curl -s -A "Mozilla/5.0" \
                "https://data.tuik.gov.tr/Bulten/Index?p=${BULTEN_ID}" 2>/dev/null)
              YILLIK=$(echo "$BULTEN_HTML" | grep -oP '\d{1,3},\d{2}(?= \(Yıl\))' | head -1)
            fi
          fi
          
          if [ -z "$YILLIK" ]; then
            echo "HATA: Değer çekilemedi"
            exit 1
          fi
          
          echo "Yıllık enflasyon: %$YILLIK"
          YILLIK_NOKTA=$(echo "$YILLIK" | tr ',' '.')
          ORAN=$(python3 -c "print(round($YILLIK_NOKTA / 100, 4))")
          AYLAR=("" "Ocak" "Şubat" "Mart" "Nisan" "Mayıs" "Haziran" "Temmuz" "Ağustos" "Eylül" "Ekim" "Kasım" "Aralık")
          GECEN_AY=$(date -d "1 month ago" +%-m)
          YIL=$(date -d "1 month ago" +%Y)
          DONEM="${AYLAR[$GECEN_AY]} $YIL"
          BUGUN=$(date +%Y-%m-%d)
          
          JSON=$(python3 -c "
          import json
          data = {'enflasyon': $ORAN, 'enflasyonPct': '%$YILLIK', 'donem': '$DONEM', 'kaynak': 'TÜİK resmi (otomatik)', 'guncelleme': '$BUGUN'}
          print(json.dumps(data, ensure_ascii=False, indent=2))
          ")
          
          PAYLOAD=$(python3 -c "
          import json
          payload = {'files': {'enflasyon.json': {'content': '''$JSON'''}}}
          print(json.dumps(payload))
          ")
          
          RESULT=$(curl -s -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/gists/$GIST_ID")
          
          UPDATED=$(echo "$RESULT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(data.get('updated_at', 'HATA'))
          " 2>/dev/null)
          
          if [[ "$UPDATED" == "HATA" ]] || [ -z "$UPDATED" ]; then
            echo "Gist güncellenemedi!"
            echo "$RESULT"
            exit 1
          fi
          
          echo "✅ Gist güncellendi: $UPDATED — %$YILLIK ($ORAN)"
