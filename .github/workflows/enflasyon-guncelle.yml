name: Enflasyon Otomatik Güncelle

on:
  schedule:
    - cron: '0 8 4 * *'
  workflow_dispatch:

jobs:
  enflasyon-guncelle:
    runs-on: ubuntu-latest
    
    steps:
      - name: TÜFE Verisini Çek ve Gist Güncelle
        env:
          GIST_ID: 793a9aa97f1c6fada2882976bd4834aa
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          echo "=== Yöntem 1: IMF DataMapper API ==="
          # IMF Türkiye TÜFE yıllık değişim - ücretsiz, bot engeli yok
          IMF_DATA=$(curl -s --max-time 30 \
            "https://www.imf.org/external/datamapper/api/v1/PCPIPCH/TUR?periods=2024,2025,2026" \
            2>/dev/null)
          
          echo "IMF yanıtı: $(echo $IMF_DATA | head -c 500)"
          
          YILLIK=$(echo "$IMF_DATA" | python3 -c "
          import json, sys
          try:
            data = json.load(sys.stdin)
            values = data['values']['PCPIPCH']['TUR']
            # En son yıl değerini al
            years = sorted(values.keys(), reverse=True)
            for y in years:
              v = values[y]
              if v is not None:
                print(round(float(v), 2))
                break
          except Exception as e:
            print('', end='')
          " 2>/dev/null)
          
          echo "IMF değeri: $YILLIK"
          
          if [ -z "$YILLIK" ] || [ "$YILLIK" = "0" ]; then
            echo "=== Yöntem 2: World Bank API ==="
            WB_DATA=$(curl -s --max-time 30 \
              "https://api.worldbank.org/v2/country/TR/indicator/FP.CPI.TOTL.ZG?format=json&mrv=2&per_page=2" \
              2>/dev/null)
            
            echo "WorldBank yanıtı: $(echo $WB_DATA | head -c 500)"
            
            YILLIK=$(echo "$WB_DATA" | python3 -c "
          import json, sys
          try:
            data = json.load(sys.stdin)
            records = data[1]
            for r in records:
              if r.get('value') is not None:
                print(round(float(r['value']), 2))
                break
          except Exception as e:
            print('', end='')
            " 2>/dev/null)
            
            echo "WorldBank değeri: $YILLIK"
          fi
          
          if [ -z "$YILLIK" ] || [ "$YILLIK" = "0" ]; then
            echo "=== Yöntem 3: OECD API ==="
            OECD_DATA=$(curl -s --max-time 30 \
              "https://stats.oecd.org/sdmx-json/data/DP_LIVE/TUR.CPI.TOT.AGRWTH.A/OECD?contentType=csv&startPeriod=2023" \
              2>/dev/null)
            
            YILLIK=$(echo "$OECD_DATA" | python3 -c "
          import sys
          lines = sys.stdin.readlines()
          # CSV son satırdan değer al
          for line in reversed(lines):
            parts = line.strip().split(',')
            if len(parts) > 5:
              try:
                v = float(parts[-1].strip('\"'))
                if v > 0:
                  print(round(v, 2))
                  break
              except:
                pass
            " 2>/dev/null)
            
            echo "OECD değeri: $YILLIK"
          fi
          
          if [ -z "$YILLIK" ] || [ "$YILLIK" = "0" ]; then
            echo "HATA: Hiçbir kaynaktan veri çekilemedi"
            exit 1
          fi
          
          # Virgülü noktaya çevir
          YILLIK_NOKTA=$(echo "$YILLIK" | tr ',' '.')
          ORAN=$(python3 -c "print(round($YILLIK_NOKTA / 100, 4))")
          
          # Dönem (geçen ay)
          AYLAR=("" "Ocak" "Şubat" "Mart" "Nisan" "Mayıs" "Haziran" \
                 "Temmuz" "Ağustos" "Eylül" "Ekim" "Kasım" "Aralık")
          GECEN_AY=$(date -d "1 month ago" +%-m)
          YIL=$(date -d "1 month ago" +%Y)
          DONEM="${AYLAR[$GECEN_AY]} $YIL"
          BUGUN=$(date +%Y-%m-%d)
          
          echo "Dönem: $DONEM | Oran: $ORAN | Yıllık: %$YILLIK"
          
          # JSON oluştur
          JSON=$(python3 -c "
          import json
          data = {
            'enflasyon': $ORAN,
            'enflasyonPct': '%$YILLIK',
            'donem': '$DONEM',
            'kaynak': 'IMF/WorldBank (TÜİK bazlı, otomatik)',
            'guncelleme': '$BUGUN'
          }
          print(json.dumps(data, ensure_ascii=False, indent=2))
          ")
          
          echo "JSON: $JSON"
          
          # Gist güncelle
          PAYLOAD=$(python3 -c "
          import json
          payload = {
            'files': {
              'enflasyon.json': {
                'content': '''$JSON'''
              }
            }
          }
          print(json.dumps(payload))
          ")
          
          RESULT=$(curl -s -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/gists/$GIST_ID")
          
          UPDATED=$(echo "$RESULT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(data.get('updated_at', 'HATA'))
          " 2>/dev/null)
          
          if [[ "$UPDATED" == "HATA" ]] || [ -z "$UPDATED" ]; then
            echo "Gist güncellenemedi: $RESULT"
            exit 1
          fi
          
          echo "✅ Gist güncellendi: $UPDATED"
          echo "✅ Enflasyon: %$YILLIK ($ORAN)"
