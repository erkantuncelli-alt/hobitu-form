<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hobitu Tedarik</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0e14;
  --surface: #13161f;
  --surface2: #1a1e2a;
  --border: #242836;
  --border2: #2e3446;
  --text: #e2e6f0;
  --text2: #7a8099;
  --text3: #4a5068;
  --accent: #f97316;
  --green: #22c55e;
  --green-bg: #0f2318;
  --green-border: #166534;
  --red: #ef4444;
  --yellow: #eab308;
  --yellow-bg: #1f1a00;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.brand-icon svg { width: 17px; height: 17px; fill: white; }
.brand-name { font-size: 15px; font-weight: 600; color: var(--text); }
.brand-sub { font-size: 10px; color: var(--text3); }
.refresh-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text2); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'DM Sans', sans-serif; }
.refresh-btn svg { width: 14px; height: 14px; }
.refresh-btn.loading svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* STATS BAR */
.stats-bar {
  display: flex; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.stat { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; text-align: center; }
.stat-num { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; }
.stat-num.red { color: var(--red); }
.stat-num.green { color: var(--green); }
.stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

/* FILTERS */
.filters { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.filter-tabs { display: flex; gap: 6px; }
.filter-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: center; transition: all 0.15s; }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text3); pointer-events: none; }
.search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px 9px 34px; font-size: 14px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; -webkit-appearance: none; }
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); }

/* CARDS */
.cards { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.card.done { opacity: 0.5; }
.card-top { padding: 14px 14px 10px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.card-siparis { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-bekliyor { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #3a2e00; }
.badge-tamamlandi { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.card-urun { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.card-not { font-size: 12px; color: var(--text3); margin-bottom: 10px; font-style: italic; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.meta-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
.meta-pill.eksik { color: var(--red); border-color: #3a1515; background: #1f0f0f; }
.card-bottom { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
.card-tarih { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.tedarik-btn { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 8px; padding: 8px 16px; color: var(--green); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.tedarik-btn:active { opacity: 0.8; }
.tedarik-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.tedarik-btn.done-btn { background: transparent; border-color: var(--border); color: var(--text3); cursor: default; font-size: 12px; }

/* EMPTY */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; color: var(--text3); text-align: center; }
.empty-state svg { width: 36px; height: 36px; opacity: 0.3; }
.empty-state p { font-size: 14px; }

/* DESKTOP TABLE */
@media (min-width: 768px) {
  .cards { display: none; }
  .table-section { display: block; padding: 0 24px 24px; }
  .filters { padding: 16px 24px; flex-direction: row; align-items: center; }
  .filter-tabs { flex: none; }
  .filter-btn { flex: none; padding: 8px 16px; font-size: 13px; }
  .search-wrap { margin-left: auto; width: 260px; }
  .stats-bar { padding: 12px 24px; }
  .header { padding: 0 24px; height: 60px; }
}
@media (max-width: 767px) {
  .table-section { display: none; }
}

/* TABLE (desktop) */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.table-header { display: grid; grid-template-columns: 130px 1fr 70px 80px 110px 85px 150px; padding: 12px 20px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); font-family: 'DM Mono', monospace; }
.table-row { display: grid; grid-template-columns: 130px 1fr 70px 80px 110px 85px 150px; padding: 14px 20px; border-bottom: 1px solid var(--border); align-items: center; transition: background 0.1s; }
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: var(--surface2); }
.table-row.done { opacity: 0.45; }
.col-siparis { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--accent); }
.col-urun { font-size: 14px; color: var(--text); font-weight: 500; padding-right: 12px; }
.col-urun small { display: block; font-size: 11px; color: var(--text3); margin-top: 2px; }
.col-num { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text2); }
.col-num.eksik { color: var(--red); font-weight: 500; }
.col-tarih { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }
.col-action { display: flex; justify-content: flex-end; }
.dt-tedarik-btn { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 8px; padding: 7px 14px; color: var(--green); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; transition: all 0.15s; }
.dt-tedarik-btn:hover { background: #14391f; }
.dt-tedarik-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.dt-tedarik-btn.done-btn { background: transparent; border-color: var(--border); color: var(--text3); cursor: default; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 0; }
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px 20px 0 0; padding: 24px 20px 36px; width: 100%; max-width: 500px; transform: translateY(100%); transition: transform 0.25s; }
.modal-overlay.show .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.modal p { font-size: 13px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
.modal-detail { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
.modal-detail .mrow { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); }
.modal-detail .mrow:last-child { border-bottom: none; }
.modal-detail .mkey { font-size: 12px; color: var(--text3); }
.modal-detail .mval { font-size: 13px; color: var(--text); font-weight: 500; font-family: 'DM Mono', monospace; text-align: right; max-width: 60%; }
.modal-btns { display: flex; gap: 10px; }
.modal-cancel { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; color: var(--text2); font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.modal-confirm { flex: 2; background: var(--green); border: none; border-radius: 10px; padding: 14px; color: white; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.modal-confirm:disabled { opacity: 0.5; }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 999; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M20 7H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-9 8H9v2H7v-2H5v-2h2v-2h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 10 18.5 10s1.5.67 1.5 1.5S19.33 13 18.5 13zM4 6h16V4H4v2z"/></svg>
    </div>
    <div>
      <div class="brand-name">Hobitu Tedarik</div>
      <div class="brand-sub">Eksik Stok Yönetimi</div>
    </div>
  </div>
  <button class="refresh-btn" onclick="loadData()" id="refreshBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Yenile
  </button>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-num red" id="countBekliyor">-</div>
    <div class="stat-label">Bekliyor</div>
  </div>
  <div class="stat">
    <div class="stat-num green" id="countTamamlandi">-</div>
    <div class="stat-label">Tamamlandı</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="countToplam">-</div>
    <div class="stat-label">Toplam</div>
  </div>
</div>

<div class="filters">
  <div class="filter-tabs">
    <button class="filter-btn active" onclick="setFilter('hepsi', this)">Tümü</button>
    <button class="filter-btn" onclick="setFilter('bekliyor', this)">Bekliyor</button>
    <button class="filter-btn" onclick="setFilter('tamamlandi', this)">Tamamlandı</button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" class="search-input" placeholder="Sipariş no veya ürün ara..." oninput="renderAll()" id="searchInput">
  </div>
</div>

<!-- MOBILE CARDS -->
<div class="cards" id="mobileCards"></div>

<!-- DESKTOP TABLE -->
<div class="table-section">
  <div class="table-wrap">
    <div class="table-header">
      <div>SİPARİŞ NO</div><div>ÜRÜN / NOT</div><div>EKSİK</div><div>RAFTAKI</div><div>TARİH</div><div>DURUM</div><div></div>
    </div>
    <div id="desktopTable"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Tedarik Tamamlandı mı?</h3>
    <p>T-Soft'ta sipariş <strong>Nurgül Sipariş Hazır</strong> sürecine alınacak ve not eklenecek.</p>
    <div class="modal-detail" id="modalDetail"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">İptal</button>
      <button class="modal-confirm" id="modalConfirm" onclick="confirmTedarik()">Evet, Tamamlandı ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LIST_URL = 'https://tuzwzs6k.rpcld.app/webhook/tedarik-listesi';
const TAMAMLA_URL = 'https://tuzwzs6k.rpcld.app/webhook/tedarik-tamamla';
let allData = [];
let currentFilter = 'hepsi';
let selectedRow = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  try {
    const res = await fetch(LIST_URL);
    allData = await res.json();
    updateStats();
    renderAll();
  } catch(e) {
    showToast('Bağlantı hatası!');
    renderEmpty();
  } finally {
    btn.classList.remove('loading');
  }
}

function updateStats() {
  const bekliyor = allData.filter(r => r['Durum'] !== 'Tedarik Edildi ✓').length;
  const tamamlandi = allData.filter(r => r['Durum'] === 'Tedarik Edildi ✓').length;
  document.getElementById('countBekliyor').textContent = bekliyor;
  document.getElementById('countTamamlandi').textContent = tamamlandi;
  document.getElementById('countToplam').textContent = allData.length;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let rows = allData;
  if (currentFilter === 'bekliyor') rows = rows.filter(r => r['Durum'] !== 'Tedarik Edildi ✓');
  if (currentFilter === 'tamamlandi') rows = rows.filter(r => r['Durum'] === 'Tedarik Edildi ✓');
  if (q) rows = rows.filter(r =>
    (r['Sipariş No'] || '').toLowerCase().includes(q) ||
    (r['Ürün Adı'] || '').toLowerCase().includes(q) ||
    (r['Not'] || '').toLowerCase().includes(q)
  );
  return rows;
}

function renderAll() {
  const rows = getFiltered();
  if (rows.length === 0) { renderEmpty(); return; }
  renderMobile(rows);
  renderDesktop(rows);
}

function renderEmpty() {
  const empty = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><p>Kayıt bulunamadı</p></div>`;
  document.getElementById('mobileCards').innerHTML = empty;
  document.getElementById('desktopTable').innerHTML = empty;
}

function renderMobile(rows) {
  document.getElementById('mobileCards').innerHTML = rows.map(row => {
    const done = row['Durum'] === 'Tedarik Edildi ✓';
    const satirNo = row.satirNo;
    return `
    <div class="card ${done ? 'done' : ''}">
      <div class="card-top">
        <div class="card-head">
          <div class="card-siparis">${row['Sipariş No'] || '-'}</div>
          ${done
            ? `<span class="badge badge-tamamlandi"><span class="badge-dot"></span>Tamamlandı</span>`
            : `<span class="badge badge-bekliyor"><span class="badge-dot"></span>Bekliyor</span>`}
        </div>
        <div class="card-urun">${row['Ürün Adı'] || '-'}</div>
        ${row['Not'] ? `<div class="card-not">${row['Not']}</div>` : ''}
        <div class="card-meta">
          <div class="meta-pill eksik">Eksik: ${row['Eksik Miktar'] || '-'}</div>
          <div class="meta-pill">Rafta: ${row['Mevcut Miktar'] || '-'}</div>
        </div>
      </div>
      <div class="card-bottom">
        <div class="card-tarih">${row['Tarih'] || '-'}</div>
        ${done
          ? `<button class="tedarik-btn done-btn" disabled>✓ Tamamlandı</button>`
          : `<button class="tedarik-btn" onclick='openModal(${satirNo}, ${JSON.stringify(row)})'>Tedarik Edildi</button>`}
      </div>
    </div>`;
  }).join('');
}

function renderDesktop(rows) {
  document.getElementById('desktopTable').innerHTML = rows.map(row => {
    const done = row['Durum'] === 'Tedarik Edildi ✓';
    const satirNo = row.satirNo;
    return `
    <div class="table-row ${done ? 'done' : ''}">
      <div class="col-siparis">${row['Sipariş No'] || '-'}</div>
      <div class="col-urun">${row['Ürün Adı'] || '-'}${row['Not'] ? `<small>${row['Not']}</small>` : ''}</div>
      <div class="col-num eksik">${row['Eksik Miktar'] || '-'}</div>
      <div class="col-num">${row['Mevcut Miktar'] || '-'}</div>
      <div class="col-tarih">${row['Tarih'] || '-'}</div>
      <div>${done ? `<span class="badge badge-tamamlandi"><span class="badge-dot"></span>Tamamlandı</span>` : `<span class="badge badge-bekliyor"><span class="badge-dot"></span>Bekliyor</span>`}</div>
      <div class="col-action">${done
        ? `<button class="dt-tedarik-btn done-btn" disabled>✓ Tamamlandı</button>`
        : `<button class="dt-tedarik-btn" onclick='openModal(${satirNo}, ${JSON.stringify(row)})'>Tedarik Edildi</button>`}
      </div>
    </div>`;
  }).join('');
}

function openModal(satirNo, row) {
  selectedRow = { satirNo, row };
  document.getElementById('modalDetail').innerHTML = `
    <div class="mrow"><span class="mkey">Sipariş No</span><span class="mval">${row['Sipariş No'] || '-'}</span></div>
    <div class="mrow"><span class="mkey">Eksik Ürün</span><span class="mval">${row['Ürün Adı'] || '-'}</span></div>
    <div class="mrow"><span class="mkey">Eksik Miktar</span><span class="mval">${row['Eksik Miktar'] || '-'} adet</span></div>
    <div class="mrow"><span class="mkey">Rafta</span><span class="mval">${row['Mevcut Miktar'] || '-'} adet</span></div>
    ${row['Not'] ? `<div class="mrow"><span class="mkey">Not</span><span class="mval">${row['Not']}</span></div>` : ''}
  `;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  selectedRow = null;
}

async function confirmTedarik() {
  if (!selectedRow) return;
  const btn = document.getElementById('modalConfirm');
  btn.disabled = true;
  btn.textContent = 'İşleniyor...';
  
  try {
    fetch(TAMAMLA_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ siparisNo: selectedRow.row['Sipariş No'], satirNo: selectedRow.satirNo })
    });

    // no-cors ile yanıt okunamaz, 500ms bekleyip başarılı say
    await new Promise(r => setTimeout(r, 500));

    const idx = allData.findIndex(r => r.satirNo === selectedRow.satirNo);
    if (idx !== -1) allData[idx]['Durum'] = 'Tedarik Edildi ✓';
    updateStats();
    renderAll();
    closeModal();
    showToast('✓ ' + selectedRow.row['Sipariş No'] + ' tamamlandı!');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Evet, Tamamlandı ✓';
  }
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
loadData();
setInterval(loadData, 120000);
</script>
</body>
</html>
