<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hobitu Tedarik Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0e14;
  --surface: #13161f;
  --surface2: #1a1e2a;
  --border: #242836;
  --border2: #2e3446;
  --text: #e2e6f0;
  --text2: #7a8099;
  --text3: #4a5068;
  --accent: #f97316;
  --accent2: #ea580c;
  --green: #22c55e;
  --green-bg: #0f2318;
  --green-border: #166534;
  --red: #ef4444;
  --red-bg: #1f0f0f;
  --yellow: #eab308;
  --yellow-bg: #1f1a00;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.brand-icon svg { width: 18px; height: 18px; fill: white; }
.brand-name { font-size: 15px; font-weight: 600; color: var(--text); }
.brand-sub { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.header-right { display: flex; align-items: center; gap: 12px; }
.refresh-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.refresh-btn:hover { border-color: var(--border2); color: var(--text); }
.refresh-btn svg { width: 14px; height: 14px; }
.refresh-btn.loading svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stats { display: flex; align-items: center; gap: 8px; }
.stat-pill {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  display: flex; align-items: center; gap: 6px;
}
.stat-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.dot-red { background: var(--red); }
.dot-green { background: var(--green); }

/* MAIN */
.main { padding: 24px; max-width: 1200px; margin: 0 auto; }

/* FILTERS */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 16px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.filter-btn:hover { color: var(--text); border-color: var(--border2); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
.search-input {
  margin-left: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px 7px 36px;
  font-size: 13px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  outline: none;
  width: 220px;
  position: relative;
  transition: border-color 0.15s;
}
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text3); pointer-events: none; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text3); }

/* TABLE */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.table-header {
  display: grid;
  grid-template-columns: 130px 1fr 80px 80px 120px 90px 140px;
  gap: 0;
  padding: 12px 20px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
}
.table-body { }
.table-row {
  display: grid;
  grid-template-columns: 130px 1fr 80px 80px 120px 90px 140px;
  gap: 0;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  transition: background 0.1s;
}
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: var(--surface2); }
.table-row.done { opacity: 0.45; }

.col-siparis {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
}
.col-siparis:hover { text-decoration: underline; }
.col-urun { font-size: 14px; color: var(--text); font-weight: 500; padding-right: 12px; }
.col-urun small { display: block; font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 400; }
.col-num { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text2); }
.col-num.eksik { color: var(--red); font-weight: 500; }
.col-tarih { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }
.col-durum { }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-bekliyor { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #3a2e00; }
.badge-tamamlandi { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

.col-action { display: flex; justify-content: flex-end; }
.tedarik-btn {
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  border-radius: 8px;
  padding: 7px 14px;
  color: var(--green);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
  white-space: nowrap;
}
.tedarik-btn:hover { background: #14391f; }
.tedarik-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.tedarik-btn.done-btn {
  background: transparent;
  border-color: var(--border);
  color: var(--text3);
  cursor: default;
}

/* EMPTY & LOADING */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 12px;
  color: var(--text3);
}
.empty-state svg { width: 40px; height: 40px; opacity: 0.3; }
.empty-state p { font-size: 14px; }
.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: 6px;
  height: 16px;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.skeleton-row { display: grid; grid-template-columns: 130px 1fr 80px 80px 120px 90px 140px; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); align-items: center; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
  padding: 20px;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 28px;
  width: 100%;
  max-width: 440px;
  transform: scale(0.95); transition: transform 0.2s;
}
.modal-overlay.show .modal { transform: scale(1); }
.modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.modal p { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
.modal-detail { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
.modal-detail .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); }
.modal-detail .row:last-child { border-bottom: none; }
.modal-detail .key { font-size: 12px; color: var(--text3); }
.modal-detail .val { font-size: 13px; color: var(--text); font-weight: 500; font-family: 'DM Mono', monospace; }
.modal-btns { display: flex; gap: 10px; }
.modal-cancel { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--text2); font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.modal-cancel:hover { color: var(--text); }
.modal-confirm { flex: 2; background: var(--green); border: none; border-radius: 10px; padding: 12px; color: white; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s; }
.modal-confirm:hover { opacity: 0.9; }
.modal-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 999; opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none; display: flex; align-items: center; gap: 8px; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { border-color: var(--green-border); }
.toast.success svg { color: var(--green); }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }

/* MOBILE */
@media (max-width: 768px) {
  .main { padding: 16px; }
  .table-header { display: none; }
  .table-wrap { border-radius: 10px; }
  .table-row { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; }
  .col-num, .col-tarih { display: inline; }
  .col-action { justify-content: flex-start; margin-top: 4px; }
  .search-input { width: 100%; }
  .filters { flex-direction: column; align-items: stretch; }
  .search-wrap { margin-left: 0; }
  .stats { display: none; }
  .skeleton-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M20 7H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-9 8H9v2H7v-2H5v-2h2v-2h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 10 18.5 10s1.5.67 1.5 1.5S19.33 13 18.5 13zM4 6h16V4H4v2z"/></svg>
    </div>
    <div>
      <div class="brand-name">Hobitu Tedarik</div>
      <div class="brand-sub">Eksik Stok Yönetimi</div>
    </div>
  </div>
  <div class="header-right">
    <div class="stats">
      <div class="stat-pill" id="statBekliyor"><span class="dot dot-red"></span><span id="countBekliyor">0</span> bekliyor</div>
      <div class="stat-pill" id="statTamamlandi"><span class="dot dot-green"></span><span id="countTamamlandi">0</span> tamamlandı</div>
    </div>
    <button class="refresh-btn" onclick="loadData()" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Yenile
    </button>
  </div>
</div>

<div class="main">
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('hepsi', this)">Tümü</button>
    <button class="filter-btn" onclick="setFilter('bekliyor', this)">Bekliyor</button>
    <button class="filter-btn" onclick="setFilter('tamamlandi', this)">Tamamlandı</button>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" placeholder="Sipariş no veya ürün ara..." oninput="renderTable()" id="searchInput">
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <div>SİPARİŞ NO</div>
      <div>ÜRÜN / NOT</div>
      <div>EKSİK</div>
      <div>RAFTAKI</div>
      <div>TARİH</div>
      <div>DURUM</div>
      <div></div>
    </div>
    <div class="table-body" id="tableBody">
      <!-- skeleton -->
      <div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:90px"></div><div class="skeleton" style="width:70px"></div><div class="skeleton" style="width:110px;margin-left:auto"></div></div>
      <div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:90px"></div><div class="skeleton" style="width:70px"></div><div class="skeleton" style="width:110px;margin-left:auto"></div></div>
      <div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:90px"></div><div class="skeleton" style="width:70px"></div><div class="skeleton" style="width:110px;margin-left:auto"></div></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Tedarik Tamamlandı mı?</h3>
    <p>Bu işlem T-Soft'ta siparişi <strong>Nurgül Sipariş Hazır</strong> sürecine alacak ve not ekleyecek.</p>
    <div class="modal-detail" id="modalDetail"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">İptal</button>
      <button class="modal-confirm" id="modalConfirm" onclick="confirmTedarik()">Evet, Tamamlandı</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span id="toastMsg"></span>
</div>

<script>
const LIST_URL = 'https://tuzwzs6k.rpcld.app/webhook/tedarik-listesi';
const TAMAMLA_URL = 'https://tuzwzs6k.rpcld.app/webhook/tedarik-tamamla';

let allData = [];
let currentFilter = 'hepsi';
let selectedRow = null;

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.className = 'toast show ' + (type || 'success');
  document.getElementById('toastMsg').textContent = msg;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  try {
    const res = await fetch(LIST_URL);
    const data = await res.json();
    allData = Array.isArray(data) ? data : [];
    updateStats();
    renderTable();
  } catch(e) {
    showToast('Veri yüklenemedi. Tekrar deneyin.', 'error');
    document.getElementById('tableBody').innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p>Bağlantı hatası</p>
      </div>`;
  } finally {
    btn.classList.remove('loading');
  }
}

function updateStats() {
  const bekliyor = allData.filter(r => (r['Durum'] || '') !== 'Tedarik Edildi ✓').length;
  const tamamlandi = allData.filter(r => (r['Durum'] || '') === 'Tedarik Edildi ✓').length;
  document.getElementById('countBekliyor').textContent = bekliyor;
  document.getElementById('countTamamlandi').textContent = tamamlandi;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let rows = allData;

  if (currentFilter === 'bekliyor') rows = rows.filter(r => (r['Durum'] || '') !== 'Tedarik Edildi ✓');
  if (currentFilter === 'tamamlandi') rows = rows.filter(r => (r['Durum'] || '') === 'Tedarik Edildi ✓');
  if (q) rows = rows.filter(r =>
    (r['Sipariş No'] || '').toLowerCase().includes(q) ||
    (r['Ürün Adı'] || '').toLowerCase().includes(q) ||
    (r['Not'] || '').toLowerCase().includes(q)
  );

  if (rows.length === 0) {
    document.getElementById('tableBody').innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <p>Kayıt bulunamadı</p>
      </div>`;
    return;
  }

  document.getElementById('tableBody').innerHTML = rows.map((row, i) => {
    const done = (row['Durum'] || '') === 'Tedarik Edildi ✓';
    const satirNo = row.satirNo || (i + 2);
    return `
    <div class="table-row ${done ? 'done' : ''}">
      <div class="col-siparis" onclick="window.open('https://www.hobitu.com', '_blank')">${row['Sipariş No'] || '-'}</div>
      <div class="col-urun">
        ${row['Ürün Adı'] || '-'}
        ${row['Not'] ? `<small>${row['Not']}</small>` : ''}
      </div>
      <div class="col-num eksik">${row['Eksik Miktar'] || '-'}</div>
      <div class="col-num">${row['Mevcut Miktar'] || '-'}</div>
      <div class="col-tarih">${formatDate(row['Tarih'])}</div>
      <div class="col-durum">
        ${done
          ? `<span class="badge badge-tamamlandi"><span class="badge-dot"></span>Tamamlandı</span>`
          : `<span class="badge badge-bekliyor"><span class="badge-dot"></span>Bekliyor</span>`
        }
      </div>
      <div class="col-action">
        ${done
          ? `<button class="tedarik-btn done-btn" disabled>✓ Tamamlandı</button>`
          : `<button class="tedarik-btn" onclick="openModal(${satirNo}, ${JSON.stringify(row).replace(/"/g, '&quot;')})">Tedarik Edildi</button>`
        }
      </div>
    </div>`;
  }).join('');
}

function formatDate(d) {
  if (!d) return '-';
  try {
    const parts = d.split('.');
    if (parts.length === 3) return `${parts[0]}.${parts[1]}`;
    return d.substring(0, 10);
  } catch(e) { return d; }
}

function openModal(satirNo, row) {
  selectedRow = { satirNo, row };
  document.getElementById('modalDetail').innerHTML = `
    <div class="row"><span class="key">Sipariş No</span><span class="val">${row['Sipariş No'] || '-'}</span></div>
    <div class="row"><span class="key">Eksik Ürün</span><span class="val">${row['Ürün Adı'] || '-'}</span></div>
    <div class="row"><span class="key">Eksik Miktar</span><span class="val">${row['Eksik Miktar'] || '-'} adet</span></div>
    <div class="row"><span class="key">Mevcut Miktar</span><span class="val">${row['Mevcut Miktar'] || '-'} adet</span></div>
    ${row['Not'] ? `<div class="row"><span class="key">Not</span><span class="val">${row['Not']}</span></div>` : ''}
  `;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  selectedRow = null;
}

async function confirmTedarik() {
  if (!selectedRow) return;
  const btn = document.getElementById('modalConfirm');
  btn.disabled = true;
  btn.textContent = 'İşleniyor...';

  try {
    await fetch(TAMAMLA_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        siparisNo: selectedRow.row['Sipariş No'],
        satirNo: selectedRow.satirNo
      })
    });

    // Lokal güncelle
    const idx = allData.findIndex(r => r['Sipariş No'] === selectedRow.row['Sipariş No']);
    if (idx !== -1) allData[idx]['Durum'] = 'Tedarik Edildi ✓';

    updateStats();
    renderTable();
    closeModal();
    showToast('✓ ' + selectedRow.row['Sipariş No'] + ' tamamlandı!', 'success');
  } catch(e) {
    showToast('Hata oluştu. Tekrar deneyin.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Evet, Tamamlandı';
  }
}

// Modal dışına tıklayınca kapat
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Sayfa yüklenince veri getir
loadData();
